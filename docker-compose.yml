networks:
  bigdata:
    driver: bridge

volumes:
  namenode:
  datanode:
  airflow-db:
  hive-metastore-db:
  spark-events:

services:

  # ═══════════════════════════════════════════
  #  HDFS
  # ═══════════════════════════════════════════

  namenode:
    build: ./hadoop
    container_name: namenode
    hostname: namenode
    networks: [bigdata]
    command: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode:/opt/hadoop/data/nameNode
    environment:
      - HADOOP_HOME=/opt/hadoop
      - JAVA_HOME=/opt/java/openjdk
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop

  datanode:
    build: ./hadoop
    container_name: datanode
    hostname: datanode
    networks: [bigdata]
    command: datanode
    depends_on: [namenode]
    ports:
      - "9864:9864"
    volumes:
      - datanode:/opt/hadoop/data/dataNode
      - ./hadoop/conf:/opt/hadoop/etc/hadoop
    environment:
      - HADOOP_HOME=/opt/hadoop
      - JAVA_HOME=/opt/java/openjdk

  # ═══════════════════════════════════════════
  #  YARN
  # ═══════════════════════════════════════════

  resourcemanager:
    build: ./hadoop
    container_name: resourcemanager
    hostname: resourcemanager
    networks: [bigdata]
    command: resourcemanager
    depends_on: [namenode, datanode]
    ports:
      - "8088:8088"
      - "19888:19888"
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop
    environment:
      - HADOOP_HOME=/opt/hadoop
      - JAVA_HOME=/opt/java/openjdk
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop

  nodemanager:
    build: ./hadoop
    container_name: nodemanager
    hostname: nodemanager
    networks: [bigdata]
    command: nodemanager
    depends_on: [resourcemanager]
    ports:
      - "8042:8042"
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop
    environment:
      - HADOOP_HOME=/opt/hadoop
      - JAVA_HOME=/opt/java/openjdk
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop

  # ═══════════════════════════════════════════
  #  Spark History Server
  # ═══════════════════════════════════════════

  spark-history:
    build: ./spark-history
    container_name: spark-history
    hostname: spark-history
    networks: [bigdata]
    depends_on: [namenode, datanode]
    ports:
      - "18080:18080"
    volumes:
      - ./hadoop/conf:/opt/hadoop/etc/hadoop
      - spark-events:/opt/spark/events
    environment:
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=hdfs://namenode:9000/spark-events"

  # ═══════════════════════════════════════════
  #  Nessie (Iceberg Catalog)
  # ═══════════════════════════════════════════

  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    hostname: nessie
    networks: [bigdata]
    ports:
      - "19120:19120"
    environment:
      - QUARKUS_HTTP_PORT=19120

  # ═══════════════════════════════════════════
  #  Hive Metastore DB
  # ═══════════════════════════════════════════

  hive-metastore-db:
    image: postgres:15
    container_name: hive-metastore-db
    hostname: hive-metastore-db
    networks: [bigdata]
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive-metastore-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ═══════════════════════════════════════════
  #  Hive Metastore
  # ═══════════════════════════════════════════

  hive-metastore:
    image: apache/hive:4.0.1
    container_name: hive-metastore
    hostname: hive-metastore
    networks: [bigdata]
    depends_on:
      namenode: { condition: service_started }
      hive-metastore-db: { condition: service_healthy }
    environment:
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-db/metastore"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: "org.postgresql.Driver"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: "hive"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: "hive"
      HIVE_SITE_CONF_datanucleus_schema_autoCreateAll: "true"
      HIVE_SITE_CONF_hive_metastore_uris: "thrift://hive-metastore:9083"
      HIVE_SITE_CONF_hive_metastore_warehouse_dir: "hdfs://namenode:9000/user/hive/warehouse"
      SERVICE_NAME: "metastore"
    ports:
      - "9083:9083"

  # ═══════════════════════════════════════════
  #  HiveServer2
  # ═══════════════════════════════════════════

  hive-server2:
    image: apache/hive:4.0.1
    container_name: hive-server2
    hostname: hive-server2
    networks: [bigdata]
    depends_on:
      hive-metastore: { condition: service_started }
    environment:
      HIVE_SITE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore-db/metastore"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName: "org.postgresql.Driver"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName: "hive"
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: "hive"
      HIVE_SITE_CONF_hive_metastore_uris: "thrift://hive-metastore:9083"
      HIVE_SITE_CONF_hive_metastore_warehouse_dir: "hdfs://namenode:9000/user/hive/warehouse"
      HIVE_SITE_CONF_hive_server2_thrift_bind_host: "0.0.0.0"
      SERVICE_NAME: "hiveserver2"
    ports:
      - "10000:10000"
      - "10002:10002"

  # ═══════════════════════════════════════════
  #  Trino
  # ═══════════════════════════════════════════

  trino:
    image: trinodb/trino:latest
    container_name: trino
    hostname: trino
    networks: [bigdata]
    depends_on: [namenode, datanode, hive-metastore, nessie]
    ports:
      - "8082:8080"
    volumes:
      - ./trino/etc:/etc/trino
      - ./trino/catalog:/etc/trino/catalog
      - ./hadoop/conf:/etc/hadoop:ro

  # ═══════════════════════════════════════════
  #  Hue
  # ═══════════════════════════════════════════

  hue:
    build: ./hue
    container_name: hue
    hostname: hue
    networks: [bigdata]
    depends_on: [airflow-db, namenode, resourcemanager, trino, hive-server2]
    ports:
      - "8888:8888"
    volumes:
      - ./hue/hue.ini:/usr/share/hue/desktop/conf/z-hue.ini

  # ═══════════════════════════════════════════
  #  Jupyter (PySpark + Iceberg)
  # ═══════════════════════════════════════════

  jupyter:
    build: ./jupyter
    container_name: jupyter
    hostname: jupyter
    networks: [bigdata]
    depends_on: [namenode, datanode, nessie, hive-metastore]
    ports:
      - "8889:8888"
    volumes:
      - ./jupyter/work:/home/jovyan/work
      - ./hadoop/conf:/opt/hadoop/etc/hadoop:ro
      - spark-events:/opt/spark/events
    environment:
      JUPYTER_ENABLE_LAB: "yes"

  # ═══════════════════════════════════════════
  #  Airflow
  # ═══════════════════════════════════════════

  airflow-db:
    image: postgres:15
    container_name: airflow-db
    hostname: airflow-db
    networks: [bigdata]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build: ./airflow
    container_name: airflow-init
    hostname: airflow-init
    networks: [bigdata]
    depends_on:
      airflow-db: { condition: service_healthy }
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8081"
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    entrypoint: /bin/bash -c "airflow db upgrade && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    build: ./airflow
    container_name: airflow-webserver
    hostname: airflow-webserver
    networks: [bigdata]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    ports:
      - "8081:8081"
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8081"
      AIRFLOW_CONN_TRINO_DEFAULT: "trino://trino:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: webserver

  airflow-scheduler:
    build: ./airflow
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    networks: [bigdata]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8081"
      AIRFLOW_CONN_TRINO_DEFAULT: "trino://trino:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: scheduler
