spark.master=yarn
spark.deploy.mode=client
spark.eventLog.enabled=true
spark.eventLog.dir=hdfs://namenode:9000/spark-events
spark.history.fs.logDirectory=hdfs://namenode:9000/spark-events

# Iceberg + Nessie — Spark сам скачает JAR-ы из Maven Central
spark.jars.packages=org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.4.3,org.apache.iceberg:iceberg-nessie:1.4.3
spark.jars.repositories=https://repo1.maven.org/maven2/

# Iceberg catalog (Nessie)
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.catalog-impl=org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.iceberg.uri=http://nessie:19120/api/v2
spark.sql.catalog.iceberg.warehouse=hdfs://namenode:9000/warehouse
spark.sql.catalog.iceberg.type=nessie

# Hive catalog (for reading old Hive tables)
spark.sql.catalog.hive=org.apache.spark.sql.hive.thriftserver.HiveThriftServer2
# — оставляем только для чтения через Trino, не через Spark

# HDFS
spark.hadoop.fs.defaultFS=hdfs://namenode:9000
spark.hadoop.dfs.replication=1
