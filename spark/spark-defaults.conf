# ─── Spark на YARN: базовые параметры ───
spark.master                     yarn
spark.deploy-mode                client
spark.eventLog.enabled           true
spark.eventLog.dir               hdfs://namenode:9000/spark-logs
spark.history.fs.logDirectory    hdfs://namenode:9000/spark-logs

# ─── Ресурсы YARN-приложений ───
spark.executor.instances         2
spark.executor.cores             2
spark.executor.memory             2g
spark.driver.memory               1g
spark.yarn.queue                  default

# ─── Iceberg ───
spark.sql.extensions              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type    hadoop
spark.sql.catalog.iceberg.warehouse hdfs://namenode:9000/warehouse
spark.sql.defaultCatalog          iceberg

# ─── Прочее ───
spark.sql.warehouse.dir           hdfs://namenode:9000/warehouse
spark.yarn.jars                   hdfs://namenode:9000/spark-jars/*
